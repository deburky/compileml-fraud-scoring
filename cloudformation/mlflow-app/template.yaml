AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  SageMaker MLflow App for local experiment tracking (compileml tests), with its
  S3 artifact store and the role the App uses to reach it.

Parameters:
  AppName:
    Type: String
    Default: mlflow-app
    AllowedPattern: "[a-zA-Z0-9](-*[a-zA-Z0-9]){0,255}"
  ModelRegistrationMode:
    Type: String
    Default: AutoModelRegistrationDisabled
    AllowedValues: [AutoModelRegistrationEnabled, AutoModelRegistrationDisabled]

Resources:
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AppName}-mlflow-access-logs-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-access-logs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # Lets the S3 server-access-logging service write ArtifactBucket's logs here.
  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub "${AccessLogsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${AccessLogsBucket.Arn}/artifact-bucket/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3:::${AppName}-mlflow-artifacts-${AWS::AccountId}-${AWS::Region}"

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: AccessLogsBucketPolicy
    Properties:
      BucketName: !Sub "${AppName}-mlflow-artifacts-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: artifact-bucket/
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  # TLS only: every S3 call to the artifact bucket must use HTTPS.
  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  MlflowAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-mlflow-app-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref ArtifactStoreAccessPolicy

  ArtifactStoreAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AppName}-artifact-store-access"
      Description: Lets the MLflow App read and write its S3 artifact store
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: !GetAtt ArtifactBucket.Arn
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub "${ArtifactBucket.Arn}/*"

  MlflowApp:
    Type: AWS::SageMaker::MlflowApp
    Properties:
      Name: !Ref AppName
      ArtifactStoreUri: !Sub "s3://${ArtifactBucket}/mlflow"
      RoleArn: !GetAtt MlflowAppRole.Arn
      ModelRegistrationMode: !Ref ModelRegistrationMode
      Tags:
        - Key: project
          Value: python-data-science
        - Key: purpose
          Value: mlflow-tracking

Outputs:
  MlflowAppArn:
    Description: Use as MLFLOW_TRACKING_URI (sagemaker-mlflow plugin resolves it)
    Value: !GetAtt MlflowApp.Arn
  MlflowVersion:
    Value: !GetAtt MlflowApp.MlflowVersion
  ArtifactBucket:
    Value: !Ref ArtifactBucket
  AccessLogsBucket:
    Value: !Ref AccessLogsBucket
