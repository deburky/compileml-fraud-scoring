[project]
name = "compileml-fraud-scoring"
version = "0.1.0"
description = "CompileML Fraud Scoring"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost>=1.2.10",
    "compileml>=0.4.3",
    "fastwoe>=0.1.8",
    "matplotlib>=3.11.1",
    "mlflow==3.10.1",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "sagemaker>3",
    "xbooster>=0.2.8",
]

[dependency-groups]
dev = [
    "boto3-stubs[sagemaker,sagemaker-runtime]>=1.43.88",
    "cfn-lint>=1.56.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbclient>=0.11.0",
    "nbconvert[webpdf]>=7.17.1",
    "nbformat>=5.11.1",
    "pandas-stubs>=3.0.5.260730",
    "ruff>=0.16.6",
    "scikit-learn-stubs>=0.0.3",
    "ty>=0.0.78",
]
